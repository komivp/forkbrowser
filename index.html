<!DOCTYPE html>
<html style="width: 100%;height: 100%;">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="never">
<meta name="viewport" content="width=1280">
<link rel="shortcut icon" href="https://browser.appfxml.com/img/fork2m.png"/>
<title>Browse FXML JSON XML M3U pages</title>
<style>
#startlogo{position:absolute;z-index:1;top:0;left:0;width:100%;height:100%;background:#2a4e6b;overflow:hidden}
#loadingTitle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:bold;color:#e0e0e0;text-align:center;z-index:5;font-family:'Comic Sans MS','Comic Sans','Trebuchet MS',cursive,sans-serif;letter-spacing:4px;opacity:0;animation:titleFadeIn 2s ease-out .8s forwards,titleGlow 4s ease-in-out 3s infinite;text-shadow:3px 3px 0 rgba(0,0,0,.4)}
#loadingTitle span{display:inline-block;opacity:0;animation:letterFadeIn .6s ease-out forwards}
#loadingTitle span:nth-child(5){width:.3em;min-width:.3em}
#loadingTitle span:nth-child(1){animation-delay:1.0s}
#loadingTitle span:nth-child(2){animation-delay:1.1s}
#loadingTitle span:nth-child(3){animation-delay:1.2s}
#loadingTitle span:nth-child(4){animation-delay:1.3s}
#loadingTitle span:nth-child(5){animation-delay:1.5s}
#loadingTitle span:nth-child(6){animation-delay:1.6s}
#loadingTitle span:nth-child(7){animation-delay:1.7s}
#loadingTitle span:nth-child(8){animation-delay:1.8s}
#loadingTitle span:nth-child(9){animation-delay:1.9s}
#loadingTitle span:nth-child(10){animation-delay:2.0s}
#loadingTitle span:nth-child(11){animation-delay:2.1s}
#loadingTitle span:nth-child(12){animation-delay:2.2s}
@keyframes titleFadeIn{0%{opacity:0;transform:translate(-50%,-55%)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes letterFadeIn{0%{opacity:0;transform:translateY(30px) scale(.5) rotate(-10deg)}60%{transform:translateY(-8px) scale(1.15) rotate(5deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes titleGlow{0%,100%{text-shadow:3px 3px 0 rgba(0,0,0,.4),0 0 20px rgba(255,255,255,.25)}50%{text-shadow:3px 3px 0 rgba(0,0,0,.4),0 0 40px rgba(255,255,255,.5),0 0 80px rgba(255,255,255,.35)}}
#startcmd.loading-status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;max-width:min(92vw,720px);font-size:13px;font-weight:500;line-height:1.35;white-space:normal;text-align:center;font-family:"Segoe UI",system-ui,sans-serif;color:rgba(255,255,255,.9);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.2);opacity:0;animation:loadingStatusFadeIn .5s ease-out 2s forwards}
#startcmd.loading-status::before{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8);animation:loadingPulse 1.2s ease-in-out infinite;margin-right:4px}
@keyframes loadingStatusFadeIn{to{opacity:1}}
@keyframes loadingPulse{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.platform-version{position:absolute;bottom:24px;right:24px;z-index:10;font-size:11px;color:rgba(255,255,255,.4);font-family:"Segoe UI",system-ui,sans-serif;opacity:0;animation:loadingStatusFadeIn .5s ease-out 2.2s forwards}
</style>
<script>
(function(){
	var n=0,max=30,dedup={},plat="unknown";
	function bootIdent(){
		var q="";
		if(plat==="mag"){
			q+="&platform=mag&cors=mag";
			try{
				if(window.gSTB){
					q+="&box_mac="+encodeURIComponent(gSTB.GetDeviceMacAddress());
					q+="&initial="+encodeURIComponent("ForkXMLviewer|"+gSTB.GetDeviceMacAddress()+"|"+gSTB.GetDeviceModel());
				}
			}catch(e){}
		}
		return q;
	}
	function argStr(v,depth){
		if(v==null) return String(v);
		var t=typeof v;
		if(t==="string"||t==="number"||t==="boolean") return String(v);
		if(t==="function") return "[function "+(v.name||"anon")+"]";
		if(v.message||v.name){
			var s=String(v.name||"Error")+": "+String(v.message||v);
			if(v.code!=null) s+=" code="+v.code;
			if(v.fileName) s+=" file="+v.fileName;
			if(v.lineNumber) s+=" line="+v.lineNumber;
			if(v.stack) s+=" stack="+String(v.stack).substr(0,250);
			return s;
		}
		if(!depth&&v.length!=null&&v.concat) return "[Array len="+v.length+"] "+argStr(v[0],1);
		try{
			if(typeof JSON!=="undefined"&&JSON.stringify){
				return JSON.stringify(v,function(key,val){
					if(val&&typeof val==="object"&&val.nodeType) return "[DOM "+val.nodeName+"]";
					if(typeof val==="function") return "[function]";
					return val;
				}).substr(0,450);
			}
		}catch(e){}
		try{
			var s="",k,p=0;
			for(k in v){
				if(v.hasOwnProperty&&!v.hasOwnProperty(k)) continue;
				if(p++>15) break;
				s+=(s?"; ":"")+k+"="+String(v[k]).substr(0,80);
			}
			if(s) return s.substr(0,450);
		}catch(e2){}
		return Object.prototype.toString.call(v);
	}
	function bootSend(stage,msg,src,line,col,err){
		if(++n>max) return;
		var now=(new Date()).getTime();
		var key=stage+"|"+String(msg).substr(0,120);
		if(dedup[key]&&now-dedup[key]<3000) return;
		dedup[key]=now;
		try{
			var d=String(msg||"");
			if(src) d+=" @"+line+":"+col+" "+src;
			if(err) d+=" / "+argStr(err);
			var m="n="+n+" stage="+stage+" d="+encodeURIComponent(d.substr(0,900))+" p="+plat;
			var img=new Image();
			img.src="/gstatic.php?do=errboot&ver=12&m="+m+bootIdent()+"&rts="+now;
		}catch(e){}
	}
	window._bootErrScript=function(src){bootSend("script-fail",src||"load failed");};
	window.onerror=function(msg,src,line,col,err){
		bootSend("onerror",msg,src,line,col,err);
		return false;
	};
	if(window.addEventListener){
		window.addEventListener("error",function(ev){
			if(ev&&ev.target&&ev.target!==window&&(ev.target.src||ev.target.href)){
				var t=ev.target,info=(t.tagName||"?").toLowerCase();
				if(t.type) info+=" type="+t.type;
				if(t.id) info+=" id="+t.id;
				if(t.rel) info+=" rel="+t.rel;
				if(t.as) info+=" as="+t.as;
				info+=" url="+(t.src||t.href||"?");
				bootSend("resource",info);
			}
		},true);
	}
	if(window.console&&console.error){
		var oldErr=console.error;
		console.error=function(){
			try{
				var args=[].slice.call(arguments),parts=[],i;
				for(i=0;i<args.length;i++) parts.push(argStr(args[i]));
				bootSend("console.error",parts.join(" | "));
			}catch(e){}
			return oldErr.apply(console,arguments);
		};
	}
	if(plat==="mag"){
		var _stbEvent;
		try{
			Object.defineProperty(window,"stbEvent",{
				configurable:true,
				enumerable:true,
				get:function(){return _stbEvent;},
				set:function(v){
					if(v&&typeof v.onEvent==="function"){
						var orig=v.onEvent;
						v.onEvent=function(ev){
							if(ev===5) bootSend("stbEvent","player error event=5");
							return orig.apply(this,arguments);
						};
					}
					_stbEvent=v;
				}
			});
		}catch(e){
			window.stbEvent={event:0,onEvent:function(ev){
				if(ev===5) bootSend("stbEvent","player error event=5");
			}};
		}
	}
})();
</script>
</head>
<body style="margin:0px;">
<div id="startlogo">
	<div id="loadingTitle">
		<span>F</span><span>o</span><span>r</span><span>k</span><span>&nbsp;</span><span>b</span><span>r</span><span>o</span><span>w</span><span>s</span><span>e</span><span>r</span>
	</div>
	<div id="startcmd" class="loading-status">Loading...</div>
	<div class="platform-version">Fork browser</div>
</div>
<div id="main">
	<div id="pr"></div>
</div>
<div id="other" style="display:none;position:absolute;top:0px;left:0px;width:0px;height:0px;"></div>
<div id="vk" style="display:none;"></div>
<div id="QualCh" style="display:none;background-color:black;"></div>
<div id="popUp" style="display:none;"></div>
<div id="player" style="display:none;"></div>
</body>
<script src="loader.js" onerror="window._bootErrScript&&window._bootErrScript(this.src)"></script>
</html>
